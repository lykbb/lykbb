<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="PromptBox: Distills reusable prompt templates from chats. All data stays in your browser.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
.bg{fill:#ffffff;stroke:#d0d7de}
.t{fill:#1f2328;font-size:18px;font-weight:700}
.d{fill:#59636e;font-size:14px}
.a{stroke:#0969da}
.pb{fill:#dafbe1}
.pt{fill:#1a7f37;font-size:12px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.t{fill:#f0f6fc}
.d{fill:#9198a1}
.a{stroke:#4493f8}
.pb{fill:#033a16}
.pt{fill:#56d364}
}
</style>
<rect class="bg" x="1" y="1" width="438" height="148" rx="12" stroke-width="1.2"/>
<text class="t" x="24" y="40">PromptBox</text>
<g class="a" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M402 38 L414 26 M404 26 H414 V36"/></g>
<text class="d" x="24" y="70">Distills reusable prompt templates from chats.</text><text class="d" x="24" y="91">All data stays in your browser.</text>
<rect class="pb" x="24" y="110" width="107" height="22" rx="11"/>
<text class="pt" x="77.4" y="125" text-anchor="middle">Browser Tool</text>
</svg>
