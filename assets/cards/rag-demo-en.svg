}
</style>
<rect class="bg" x="1" y="1" width="438" height="148" rx="12" stroke-width="1.2"/>
<text class="t" x="24" y="40">Rag-demo</text>
<g class="a" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M402 38 L414 26 M404 26 H414 V36"/></g>
<text class="d" x="24" y="70">A hands-on RAG demo.</text>
<rect class="pb" x="24" y="110" width="106" height="22" rx="11"/>
<text class="pt" x="77.1" y="125" text-anchor="middle">RAG Practice</text>
