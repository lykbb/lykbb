<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="Rag-demo: A hands-on RAG demo.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
.bg{fill:#ffffff;stroke:#d0d7de}
.t{fill:#1f2328;font-size:18px;font-weight:700}
.d{fill:#59636e;font-size:14px}
.a{stroke:#0969da}
.pb{fill:#d8f6f3}
.pt{fill:#0f766e;font-size:12px;font-weight:600}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.t{fill:#f0f6fc}
.d{fill:#9198a1}
