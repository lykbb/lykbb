<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">Yukun</title>
  <desc id="desc">AI 产品 · Agent · RAG。探索 AI 产品，实践 Agent 与 RAG。记录学习和实践中的问题与思考。</desc>
  <defs>
    <!-- 名字上的流光：约 2 秒扫过一次，然后停 6 秒 -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="540" y2="0">
      <stop offset="0" stop-color="#ece9e3"/>
      <stop offset="0.42" stop-color="#ece9e3"/>
      <stop offset="0.5" stop-color="#f3a571"/>
      <stop offset="0.58" stop-color="#ece9e3"/>
      <stop offset="1" stop-color="#ece9e3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0;320 0;320 0" keyTimes="0;0.28;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e3864f"/>
      <stop offset="1" stop-color="#e3864f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="outer"><rect x="2" y="2" width="796" height="216" rx="18"/></clipPath>
    <clipPath id="inner"><rect x="5" y="5" width="790" height="210" rx="15"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <path id="rim" d="M22 4 H778 A18 18 0 0 1 796 22 V198 A18 18 0 0 1 778 216 H22 A18 18 0 0 1 4 198 V22 A18 18 0 0 1 22 4 Z"/>
  </defs>

  <!-- 星光边框：两团暖光沿边框慢慢绕 -->
  <rect x="2" y="2" width="796" height="216" rx="18" fill="#2f2d29"/>
  <g clip-path="url(#outer)">
    <circle r="70" fill="url(#glow)"><animateMotion dur="12s" repeatCount="indefinite"><mpath href="#rim" xlink:href="#rim"/></animateMotion></circle>
    <circle r="70" fill="url(#glow)"><animateMotion dur="12s" begin="-6s" repeatCount="indefinite"><mpath href="#rim" xlink:href="#rim"/></animateMotion></circle>
  </g>
  <rect x="5" y="5" width="790" height="210" rx="15" fill="#171614"/>

  <!-- 晕染背景：几团暖色光慢慢飘 -->
  <g clip-path="url(#inner)">
    <g filter="url(#soft)" opacity="0.5">
      <circle cx="140" cy="70" r="90" fill="#8a4626"><animateTransform attributeName="transform" type="translate" values="0 0;60 30;20 60;0 0" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="160" r="90" fill="#6b4a2c"><animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;-20 -60;0 0" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="210" r="80" fill="#3f3858"><animateTransform attributeName="transform" type="translate" values="0 0;50 -20;-40 -30;0 0" dur="22s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#e3864f">AI 产品 · Agent · RAG</text>
  <text x="400" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="700" fill="url(#shine)">Yukun</text>
  <text x="400" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" fill="#a8a399">探索 AI 产品，实践 Agent 与 RAG。</text>
  <text x="400" y="186" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" fill="#a8a399">记录学习和实践中的问题与思考。</text>
</svg>
